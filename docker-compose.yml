version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: velapal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: velapal_v6
    ports:
      - "5433:5432"    # <--- GANTI JADI INI BIAR NGGAK BENTROK
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: velapal-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: velapal-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9002:9000"     
      - "9003:9001"     
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  qdrantdata:
  miniodata:
